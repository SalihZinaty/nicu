<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a6f7a" />
  <title>SENSE &amp; NIDCAP — מדריך להורי הפג</title>
  <meta name="description" content="מדריך ידידותי להורי הפגייה: SENSE, 5S, סימני סטרס, ותוכנית שבועית לפי גיל הפג. עברית וערבית." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main" data-i18n="skipToContent">דלג לתוכן</a>

  <!-- Inline SVG icon library — referenced by <use href="#icon-name"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-hand" viewBox="0 0 48 48">
        <path d="M16 28V14a3 3 0 1 1 6 0v10m0-12a3 3 0 1 1 6 0v12m0-10a3 3 0 1 1 6 0v14m0-10a3 3 0 1 1 6 0v10c0 7-5 12-12 12s-12-3-12-10v-6c0-2 2-3 4-2l2 1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-ear" viewBox="0 0 48 48">
        <path d="M18 36c0 4 3 6 6 6s6-2 6-6c0-3-3-5-3-9 0-5 4-7 4-12 0-6-5-11-11-11S9 9 9 15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M36 12a8 8 0 0 1 0 12M40 8a14 14 0 0 1 0 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-nose" viewBox="0 0 48 48">
        <path d="M24 6c-2 8-8 14-8 22 0 5 3 8 8 8s8-3 8-8c0-8-6-14-8-22Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="20" cy="30" r="1.5" fill="currentColor"/>
        <circle cx="28" cy="30" r="1.5" fill="currentColor"/>
      </symbol>
      <symbol id="i-lips" viewBox="0 0 48 48">
        <path d="M6 24c0-4 8-8 18-8s18 4 18 8-8 10-18 10S6 28 6 24Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M6 24c4-2 8-2 12 0s8 2 12 0 8-2 12 0" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <symbol id="i-eye" viewBox="0 0 48 48">
        <path d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="24" cy="24" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="2" fill="currentColor"/>
      </symbol>
      <symbol id="i-move" viewBox="0 0 48 48">
        <path d="M24 6v36M6 24h36" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M18 12l6-6 6 6M30 36l-6 6-6-6M12 18l-6 6 6 6M36 30l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-kangaroo" viewBox="0 0 48 48">
        <path d="M24 14a6 6 0 0 1 6-6c4 0 6 3 6 6s-2 5-4 7l-8 8-8-8c-2-2-4-4-4-7s2-6 6-6a6 6 0 0 1 6 6Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M8 32c2 4 8 8 16 8s14-4 16-8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-talk" viewBox="0 0 48 48">
        <path d="M6 14c0-3 2-5 5-5h26c3 0 5 2 5 5v16c0 3-2 5-5 5H20l-8 7v-7h-1c-3 0-5-2-5-5V14Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M24 18l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" fill="currentColor"/>
      </symbol>
      <symbol id="i-quiet" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M24 12v14M20 28h8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M14 36c2 2 6 4 10 4s8-2 10-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M24 12v12l8 5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-heart" viewBox="0 0 48 48">
        <path d="M24 40s-14-8-14-20a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 12-14 20-14 20Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-warn" viewBox="0 0 48 48">
        <path d="M24 6 4 40h40Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M24 18v10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="24" cy="33" r="1.6" fill="currentColor"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M14 24l7 7 13-14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- Language switcher -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-heart"><use href="#i-heart"></use></svg>
      <span class="brand-text">SENSE &amp; NIDCAP</span>
    </div>
    <button id="langSwitch" class="lang-switch" aria-label="Switch language">العربية</button>
  </header>

  <main id="main">

    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-carousel" aria-hidden="true">
        <!-- Track is duplicated 2x so the loop is seamless.
             data-pos tunes the crop focal point per image. -->
        <div class="carousel-track">
          <div class="carousel-slide" data-pos="right"> <img src="images/hero.jpg"      alt="" loading="eager" /></div>
          <div class="carousel-slide" data-pos="right"> <img src="images/shush.jpg"     alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="bottom"><img src="images/incubator.jpg" alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="center"><img src="images/care.jpg"      alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="center"><img src="images/hand.jpg"      alt="" loading="lazy"  /></div>
          <!-- duplicate set for seamless loop -->
          <div class="carousel-slide" data-pos="right"> <img src="images/hero.jpg"      alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="right"> <img src="images/shush.jpg"     alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="bottom"><img src="images/incubator.jpg" alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="center"><img src="images/care.jpg"      alt="" loading="lazy"  /></div>
          <div class="carousel-slide" data-pos="center"><img src="images/hand.jpg"      alt="" loading="lazy"  /></div>
        </div>
      </div>
      <div class="hero-text">
        <span class="hero-kicker" data-bind="hero.kicker"></span>
        <h1 id="hero-title" class="hero-title" data-bind="hero.title"></h1>
        <p class="hero-tagline" data-bind="hero.tagline"></p>
      </div>
      <a class="scroll-hint" href="#intro" aria-hidden="true">
        <span data-bind="hero.scrollHint"></span>
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <!-- INTRO -->
    <section id="intro" class="intro" aria-labelledby="intro-title">
      <div class="container">
        <h2 id="intro-title" class="section-title" data-bind="intro.title"></h2>
        <div class="intro-body" data-bind-html="intro.bodyHtml"></div>
        <div class="intro-pill" data-bind="intro.pill"></div>
      </div>
    </section>

    <!-- SENSES -->
    <section id="senses" class="senses" aria-labelledby="senses-title">
      <div class="container">
        <h2 id="senses-title" class="section-title" data-bind="sensesTitle"></h2>
        <div id="sensesGrid" class="senses-grid"></div>
      </div>
    </section>

    <!-- 5S -->
    <section id="five-s" class="five-s" aria-labelledby="five-s-title">
      <div class="container">
        <h2 id="five-s-title" class="section-title" data-bind="method5sTitle"></h2>
        <p class="section-intro" data-bind="method5sIntro"></p>
        <div id="method5sGrid" class="five-s-grid"></div>
      </div>
    </section>

    <!-- SIGNS -->
    <section id="signs" class="signs" aria-labelledby="signs-title">
      <div class="container">
        <h2 id="signs-title" class="section-title" data-bind="signsTitle"></h2>
        <div class="signs-grid">
          <article class="sign-card sign-stress">
            <header>
              <svg class="sign-ico"><use href="#i-warn"></use></svg>
              <h3 data-bind="signsStress.heading"></h3>
            </header>
            <ul id="signsStressList"></ul>
            <p class="sign-cta" data-bind="signsStress.cta"></p>
          </article>
          <article class="sign-card sign-calm">
            <header>
              <svg class="sign-ico"><use href="#i-check"></use></svg>
              <h3 data-bind="signsCalm.heading"></h3>
            </header>
            <ul id="signsCalmList"></ul>
            <p class="sign-cta" data-bind="signsCalm.cta"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- WEEKLY PLAN -->
    <section id="plan" class="plan" aria-labelledby="plan-title">
      <div class="container">
        <h2 id="plan-title" class="section-title" data-bind="planTitle"></h2>
        <p class="section-intro" data-bind="planIntro"></p>
        <div id="planTabs" class="plan-tabs" role="tablist"></div>
        <div id="planPanel" class="plan-panel" role="tabpanel"></div>
      </div>
    </section>

    <!-- TIPS -->
    <section id="tips" class="tips" aria-labelledby="tips-title">
      <div class="container">
        <h2 id="tips-title" class="section-title" data-bind="tipsTitle"></h2>
        <div id="tipsGrid" class="tips-grid"></div>
      </div>
    </section>

    <!-- RESEARCH -->
    <section id="research" class="research" aria-labelledby="research-title">
      <div class="container">
        <h2 id="research-title" class="section-title" data-bind="researchTitle"></h2>
        <div id="researchGrid" class="research-grid"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-msg" data-bind="footer.message"></p>
      <p class="footer-contact" data-bind="footer.contact"></p>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
