# Deploys the SPA to GitHub Pages on every push to master.
# View runs at: https://github.com/SalihZinaty/nicu/actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:        # also lets you trigger manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy. Don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'           # whole repo is the site root (index.html lives here)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
